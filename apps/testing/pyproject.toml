[project]
name = "testing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ujjwalkat07", email = "ukcode07@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asi-telemetry",
    "fastapi>=0.142.2",
    "google-genai>=2.29.0",
    "opentelemetry-sdk>=1.45.1",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.4",
    "uagents>=0.26.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.uv.sources]
asi-telemetry = { path = "../app-sdk", editable = true }

[tool.pyrefly]
search-path = ["../app-sdk/src"]

[tool.pyright]
extraPaths = ["../app-sdk/src"]


