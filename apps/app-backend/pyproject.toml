[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for ASI-Telemetry metrics ingestion and dashboard API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0,<2.1",
    "alembic>=1.20.0",
    "pg8000>=1.31.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "pwdlib[argon2]>=0.2.1",
    "email-validator>=2.1.0",
]

[tool.uv]
package = false
